name: GitOps
on:
  push:
    branches:
      - env-prod
  workflow_dispatch:
    inputs:
      run_apply:
        description: Run Terraform apply
        type: boolean
        default: false
        required: false
permissions:
  id-token: write
  contents: read
  actions: write
jobs:
  manage-infrastructure:
    runs-on: ubuntu-22.04
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_github_token: ${{ github.token }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
      TF_VAR_fallback_mail_password: ${{ secrets.FALLBACK_MAIL_PASSWORD }}
      TF_VAR_recaptcha_site_key: ${{ vars.RECAPTCHA_SITE_KEY }}
      TF_VAR_recaptcha_secret: ${{ secrets.RECAPTCHA_SECRET }}
      RUN_TERRAFORM_APPLY: ${{ vars.RUN_TERRAFORM_APPLY }}
      TF_VAR_fallback_mail_enabled: ${{ vars.FALLBACK_MAIL_ENABLED }}
      TF_VAR_fallback_mail_host: ${{ vars.FALLBACK_MAIL_HOST }}
      TF_VAR_fallback_mail_port: ${{ vars.FALLBACK_MAIL_PORT }}
      TF_VAR_fallback_mail_username: ${{ vars.FALLBACK_MAIL_USERNAME }}
      TF_VAR_mail_host: ${{ vars.MAIL_HOST }}
      TF_VAR_mail_port: ${{ vars.MAIL_PORT }}
      TF_VAR_mail_username: ${{ vars.MAIL_USERNAME }}
      TF_VAR_mail_from: ${{ vars.MAIL_FROM }}
      TF_VAR_mail_base_url: ${{ vars.MAIL_BASE_URL }}
      TF_VAR_mail_from_contact: ${{ vars.MAIL_FROM_CONTACT }}
      APP_NAME: app-springboot-blog-devalgas
      RESOURCE_GROUP: rg-devalgas-springboot-azure
      PLAN_NAME: asp-springboot
      DB_NAME: db-postgres-blog-devalgas
      KEY_VAULT_NAME: kv-devalgas-blog
      ADMIN_OBJECT_ID: ${{ vars.ADMIN_OBJECT_ID }}
      ADMIN_UPN: kamgadevalgas@gmail.com
      # Defender pricing tiers (prod policy: Standard on App Services)
      TF_VAR_enable_defender_pricing: true
      TF_VAR_defender_tier_app_services: Standard
      TF_VAR_defender_tier_open_source_db: Free
      TF_VAR_defender_tier_key_vaults: Free
      TF_VAR_enable_cdn: ${{ vars.ENABLE_CDN }}
      TF_VAR_cdn_profile_name: ${{ vars.CDN_PROFILE_NAME }}
      TF_VAR_cdn_endpoint_name: ${{ vars.CDN_ENDPOINT_NAME }}
      TF_VAR_cdn_origin_hostname: ${{ vars.CDN_ORIGIN_HOSTNAME }}
      TF_VAR_cdn_querystring_behavior: ${{ vars.CDN_QUERYSTRING_BEHAVIOR }}
      TF_VAR_cdn_monthly_budget_eur: ${{ vars.CDN_MONTHLY_BUDGET_EUR }}
      TF_VAR_cdn_budget_contact_email: ${{ vars.CDN_BUDGET_CONTACT_EMAIL }}
      TF_VAR_cdn_budget_start_date: ${{ vars.CDN_BUDGET_START_DATE }}
    outputs:
      application_name: ${{ steps.set-outputs.outputs.application_name }}
      application_url: ${{ steps.set-outputs.outputs.application_url }}
      resource_group: ${{ steps.set-outputs.outputs.resource_group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Detect Service Principal secret
        id: detect-sp
        shell: bash
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZ_CREDS" ]; then
            echo "HAS_SP=true" >> "$GITHUB_ENV"
            echo "TF_VAR_use_oidc=false" >> "$GITHUB_ENV"
          else
            echo "HAS_SP=false" >> "$GITHUB_ENV"
            echo "TF_VAR_use_oidc=true" >> "$GITHUB_ENV"
          fi
      - name: Populate Terraform variables from secrets
        shell: bash
        env:
          S_JWT_1: ${{ secrets.JWT_SECRET }}
          S_JWT_2: ${{ secrets.jwt_secret }}
          S_DB_1: ${{ secrets.DB_PASSWORD }}
          S_DB_2: ${{ secrets.db_password }}
          S_DB_3: ${{ secrets.TF_VAR_db_password }}
          S_MAIL_1: ${{ secrets.MAIL_PASSWORD }}
          S_MAIL_2: ${{ secrets.mail_password }}
          S_FB_MAIL_1: ${{ secrets.FALLBACK_MAIL_PASSWORD }}
          S_FB_MAIL_2: ${{ secrets.fallback_mail_password }}
        run: |
          if [ -z "${TF_VAR_jwt_secret}" ]; then
            v="${S_JWT_1:-${S_JWT_2}}"
            if [ -n "$v" ]; then echo "TF_VAR_jwt_secret=$v" >> "$GITHUB_ENV"; fi
          fi
          if [ -z "${TF_VAR_db_password}" ]; then
            v="${S_DB_1:-${S_DB_2:-${S_DB_3}}}"
            if [ -n "$v" ]; then echo "TF_VAR_db_password=$v" >> "$GITHUB_ENV"; fi
          fi
          if [ -z "${TF_VAR_mail_password}" ]; then
            v="${S_MAIL_1:-${S_MAIL_2}}"
            if [ -n "$v" ]; then echo "TF_VAR_mail_password=$v" >> "$GITHUB_ENV"; fi
          fi
          if [ -z "${TF_VAR_fallback_mail_password}" ]; then
            v="${S_FB_MAIL_1:-${S_FB_MAIL_2}}"
            if [ -n "$v" ]; then echo "TF_VAR_fallback_mail_password=$v" >> "$GITHUB_ENV"; fi
          fi
      - name: Detect Terraform variables
        id: detect-tfvars
        shell: bash
        run: |
          ok=true
          for v in TF_VAR_jwt_secret TF_VAR_db_password; do
            if [ -z "${!v}" ]; then ok=false; fi
          done
          if [ "$ok" = "true" ]; then
            echo "HAS_TF_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_TF_SECRETS=false" >> "$GITHUB_ENV"
          fi
      - name: Debug apply conditions
        shell: bash
        run: |
          echo "RUN_TERRAFORM_APPLY=${RUN_TERRAFORM_APPLY}"
          echo "EVENT_NAME=${{ github.event_name }}"
          echo "RUN_APPLY_INPUT=${{ github.event.inputs.run_apply }}"
          echo "HAS_TF_SECRETS=${HAS_TF_SECRETS}"
          echo "HAS_SP=${HAS_SP}"
          echo "ACTOR=${{ github.actor }}"
          echo "REPO_OWNER=${{ github.repository_owner }}"
      - name: Detect GH admin token and set Terraform gating
        shell: bash
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -n "${GH_ADMIN_TOKEN}" ]; then
            echo "Detected GH admin token; enabling Terraform management of GitHub variables"
            echo "TF_VAR_github_token=${GH_ADMIN_TOKEN}" >> "$GITHUB_ENV"
            echo "TF_VAR_manage_github_vars=true" >> "$GITHUB_ENV"
          else
            echo "No GH admin token; disabling Terraform management of GitHub variables"
            echo "TF_VAR_manage_github_vars=false" >> "$GITHUB_ENV"
          fi
      - name: Normalize TF_VAR_fallback_mail_enabled
        shell: bash
        env:
          FALLBACK: ${{ vars.FALLBACK_MAIL_ENABLED }}
        run: |
          v="$(echo "${FALLBACK}" | tr '[:upper:]' '[:lower:]')"
          case "$v" in
            1|true|yes|on) echo "TF_VAR_fallback_mail_enabled=true" >> "$GITHUB_ENV" ;;
            *) echo "TF_VAR_fallback_mail_enabled=false" >> "$GITHUB_ENV" ;;
          esac
      - name: Normalize TF_VAR_enable_cdn
        shell: bash
        env:
          ENABLE_CDN: ${{ vars.ENABLE_CDN }}
        run: |
          v="$(echo "${ENABLE_CDN}" | tr '[:upper:]' '[:lower:]')"
          case "$v" in
            1|true|yes|on) echo "TF_VAR_enable_cdn=true" >> "$GITHUB_ENV" ;;
            *) echo "TF_VAR_enable_cdn=false" >> "$GITHUB_ENV" ;;
          esac
      - name: Normalize TF_VAR_cdn_budget_start_date (RFC3339)
        shell: bash
        env:
          BUDGET_START_DATE: ${{ vars.CDN_BUDGET_START_DATE }}
        run: |
          d="${BUDGET_START_DATE}"
          if [ -n "$d" ]; then
            if echo "$d" | grep -Eq 'T[0-9]{2}:[0-9]{2}'; then
              echo "TF_VAR_cdn_budget_start_date=$d" >> "$GITHUB_ENV"
            else
              echo "TF_VAR_cdn_budget_start_date=${d}T00:00:00Z" >> "$GITHUB_ENV"
            fi
          fi
      - name: Azure login (Service Principal)
        if: ${{ env.HAS_SP == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Azure login (OIDC)
        if: ${{ env.HAS_SP == 'false' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve admin user object id
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            if [ -z "${ADMIN_OBJECT_ID}" ] && [ -n "${ADMIN_UPN}" ]; then
              oid=$(az ad user show --id "${ADMIN_UPN}" --query "id" -o tsv 2>/dev/null || true)
              if [ -n "$oid" ]; then
                echo "TF_VAR_admin_user_object_id=${oid}" >> "$GITHUB_ENV"
              fi
            fi
            if [ -z "${TF_VAR_admin_user_object_id}" ] && [ "${HAS_SP}" = "true" ]; then
              oid=$(az ad sp show --id "${ARM_CLIENT_ID}" --query "id" -o tsv 2>/dev/null || true)
              if [ -n "$oid" ]; then
                echo "TF_VAR_admin_user_object_id=${oid}" >> "$GITHUB_ENV"
              fi
            fi
      - name: Configure Service Principal env for Terraform
        if: ${{ env.HAS_SP == 'true' }}
        shell: bash
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          python3 - <<'PY' | while read line; do echo "$line" >> "$GITHUB_ENV"; done
          import os, json
          creds = json.loads(os.environ["AZ_CREDS"])
          print(f"ARM_CLIENT_ID={creds['clientId']}")
          print(f"ARM_CLIENT_SECRET={creds['clientSecret']}")
          print(f"ARM_SUBSCRIPTION_ID={creds['subscriptionId']}")
          print(f"ARM_TENANT_ID={creds['tenantId']}")
          PY
      - name: Terraform fmt (auto)
        working-directory: ./terraform
        run: terraform fmt -recursive
      - name: Terraform fmt
        working-directory: ./terraform
        run: terraform fmt -check
      - name: Terraform init
        working-directory: ./terraform
        run: terraform init -upgrade -input=false
      - name: Register required Azure Resource Providers
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            for ns in Microsoft.KeyVault Microsoft.Web Microsoft.DBforPostgreSQL Microsoft.CDN; do
              echo "Registering provider: $ns"
              az provider register --namespace "$ns" || true
              for i in $(seq 1 12); do
                state=$(az provider show -n "$ns" --query "registrationState" -o tsv || echo "Unknown")
                echo "$ns state: $state"
                if [ "$state" = "Registered" ]; then break; fi
                sleep 5
              done
            done
      - name: Audit CDN/Front Door resources in resource group
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ env.RESOURCE_GROUP }}"
            echo "Listing classic CDN profiles/endpoints (if any):"
            az cdn profile list -g "$RG" -o table || true
            az cdn endpoint list -g "$RG" -o table || true
            echo "Listing Azure Front Door profiles/endpoints:"
            az afd profile list -g "$RG" -o table || true
            az afd endpoint list -g "$RG" -o table || true
      - name: Remove legacy CDN profiles/endpoints (classic)
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ env.RESOURCE_GROUP }}"
            profiles=$(az cdn profile list -g "$RG" --query "[].name" -o tsv 2>/dev/null || true)
            if [ -n "$profiles" ]; then
              for p in $profiles; do
                echo "Processing legacy CDN profile: $p"
                endpoints=$(az cdn endpoint list -g "$RG" --profile-name "$p" --query "[].name" -o tsv 2>/dev/null || true)
                if [ -n "$endpoints" ]; then
                  for e in $endpoints; do
                    echo "Deleting CDN endpoint: $e (profile: $p)"
                    az cdn endpoint delete -g "$RG" --profile-name "$p" -n "$e" --yes || true
                  done
                fi
                echo "Deleting CDN profile: $p"
                az cdn profile delete -g "$RG" -n "$p" --yes || true
              done
            else
              echo "No legacy CDN profiles found in resource group $RG"
            fi
      - name: Compute Key Vault name
        shell: bash
        run: |
          KV_CALC="${KEY_VAULT_NAME}"
          echo "KV_NAME_CALC=${KV_CALC}" >> "$GITHUB_ENV"
      - name: Set TF_VAR_key_vault_name
        shell: bash
        run: |
          echo "TF_VAR_key_vault_name=${KEY_VAULT_NAME}" >> "$GITHUB_ENV"
      - name: Set TF_VAR_admin_user_object_id
        shell: bash
        run: |
          if [ -n "${ADMIN_OBJECT_ID}" ]; then
            echo "TF_VAR_admin_user_object_id=${ADMIN_OBJECT_ID}" >> "$GITHUB_ENV"
          fi
      - name: Detect existing Key Vault
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            if az keyvault show -n "${KEY_VAULT_NAME}" -g "${RESOURCE_GROUP}" &>/dev/null; then
              echo "KV_NAME_EXISTING=${KEY_VAULT_NAME}" >> "$GITHUB_ENV"
            fi
      - name: Detect Key Vault permission model
        if: ${{ env.KV_NAME_EXISTING != '' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RBAC=$(az keyvault show -n "${KEY_VAULT_NAME}" -g "${RESOURCE_GROUP}" --query "properties.enableRbacAuthorization" -o tsv 2>/dev/null || echo "")
            if [ -n "$RBAC" ]; then
              echo "KV_RBAC_ENABLED=${RBAC}" >> "$GITHUB_ENV"
            fi
      - name: Set TF_VAR_enable_keyvault_rbac from permission model
        shell: bash
        run: |
          if [ -n "${KV_NAME_EXISTING}" ]; then
            if [ "${KV_RBAC_ENABLED}" = "true" ]; then
              echo "TF_VAR_enable_keyvault_rbac=true" >> "$GITHUB_ENV"
            else
              echo "TF_VAR_enable_keyvault_rbac=false" >> "$GITHUB_ENV"
            fi
          else
            echo "TF_VAR_enable_keyvault_rbac=true" >> "$GITHUB_ENV"
          fi
      - name: Detect existing Azure resources (WebApp, Plan, Postgres, ActionGroup)
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            if az webapp show -n "${APP_NAME}" -g "${RESOURCE_GROUP}" &>/dev/null; then
              echo "HAS_APP=true" >> "$GITHUB_ENV"
            else
              echo "HAS_APP=false" >> "$GITHUB_ENV"
            fi
            if az appservice plan show -n "${PLAN_NAME}" -g "${RESOURCE_GROUP}" &>/dev/null; then
              echo "HAS_PLAN=true" >> "$GITHUB_ENV"
            else
              echo "HAS_PLAN=false" >> "$GITHUB_ENV"
            fi
            if az postgres flexible-server show -n "${DB_NAME}" -g "${RESOURCE_GROUP}" &>/dev/null; then
              echo "HAS_DB=true" >> "$GITHUB_ENV"
              # Check DB child resources
              if az postgres flexible-server db show -g "${RESOURCE_GROUP}" --server-name "${DB_NAME}" --name "appdb" &>/dev/null; then
                echo "HAS_DB_DATABASE=true" >> "$GITHUB_ENV"
              else
                echo "HAS_DB_DATABASE=false" >> "$GITHUB_ENV"
              fi
              if az postgres flexible-server firewall-rule show -g "${RESOURCE_GROUP}" --name "allow-azure-services" --server-name "${DB_NAME}" &>/dev/null; then
                echo "HAS_DB_FIREWALL_RULE=true" >> "$GITHUB_ENV"
              else
                echo "HAS_DB_FIREWALL_RULE=false" >> "$GITHUB_ENV"
              fi
            else
              echo "HAS_DB=false" >> "$GITHUB_ENV"
              echo "HAS_DB_DATABASE=false" >> "$GITHUB_ENV"
              echo "HAS_DB_FIREWALL_RULE=false" >> "$GITHUB_ENV"
            fi
            ACS_NAME="acs-${APP_NAME}"
            EMAIL_NAME="email-${APP_NAME}"
            if az resource show -g "${RESOURCE_GROUP}" -n "${ACS_NAME}" --resource-type "Microsoft.Communication/CommunicationServices" &>/dev/null; then
              echo "HAS_ACS=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ACS=false" >> "$GITHUB_ENV"
            fi
            if az resource show -g "${RESOURCE_GROUP}" -n "${EMAIL_NAME}" --resource-type "Microsoft.Communication/EmailServices" &>/dev/null; then
              echo "HAS_EMAIL_SERVICE=true" >> "$GITHUB_ENV"
            else
              echo "HAS_EMAIL_SERVICE=false" >> "$GITHUB_ENV"
            fi
            if az webapp config hostname list -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "length(@)" -o tsv 2>/dev/null | grep -q '^[1-9]'; then
              echo "HAS_CUSTOM_HOSTNAMES=true" >> "$GITHUB_ENV"
            else
              echo "HAS_CUSTOM_HOSTNAMES=false" >> "$GITHUB_ENV"
            fi
            if az monitor action-group show -n "ag-springboot-alerts" -g "${RESOURCE_GROUP}" &>/dev/null; then
              echo "HAS_ACTION_GROUP=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ACTION_GROUP=false" >> "$GITHUB_ENV"
            fi
            # Metric alerts (DB CPU)
            if az monitor metrics alert show -g "${RESOURCE_GROUP}" -n "alert-db-high-cpu" &>/dev/null; then
              echo "HAS_ALERT_DB_HIGH_CPU=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ALERT_DB_HIGH_CPU=false" >> "$GITHUB_ENV"
            fi
            if az monitor metrics alert show -g "${RESOURCE_GROUP}" -n "alert-db-low-cpu" &>/dev/null; then
              echo "HAS_ALERT_DB_LOW_CPU=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ALERT_DB_LOW_CPU=false" >> "$GITHUB_ENV"
            fi
            if az monitor metrics alert show -g "${RESOURCE_GROUP}" -n "alert-high-memory" &>/dev/null; then
              echo "HAS_ALERT_HIGH_MEMORY=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ALERT_HIGH_MEMORY=false" >> "$GITHUB_ENV"
            fi
            if az monitor metrics alert show -g "${RESOURCE_GROUP}" -n "alert-low-memory" &>/dev/null; then
              echo "HAS_ALERT_LOW_MEMORY=true" >> "$GITHUB_ENV"
            else
              echo "HAS_ALERT_LOW_MEMORY=false" >> "$GITHUB_ENV"
            fi
      - name: Ensure DB admin password matches TF_VAR_db_password
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            if [ -n "${TF_VAR_db_password}" ]; then
              if az postgres flexible-server show -n "${DB_NAME}" -g "${RESOURCE_GROUP}" &>/dev/null; then
                echo "Updating DB admin password for ${DB_NAME}"
                az postgres flexible-server update -n "${DB_NAME}" -g "${RESOURCE_GROUP}" --admin-password "${TF_VAR_db_password}"
              else
                echo "DB server ${DB_NAME} not found; skipping admin password update"
              fi
            else
              echo "TF_VAR_db_password is empty; skipping admin password update"
            fi
      - name: Assert provider registration and Key Vault readiness
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            state=$(az provider show -n "Microsoft.KeyVault" --query "registrationState" -o tsv || echo "Unknown")
            echo "KV_PROVIDER_STATE=${state}" >> "$GITHUB_ENV"
            if [ -n "${KV_NAME_EXISTING}" ]; then
              echo "KV_READY=true" >> "$GITHUB_ENV"
            else
              if [ "${state}" = "Registered" ]; then
                echo "KV_READY=true" >> "$GITHUB_ENV"
              else
                echo "KV_READY=false" >> "$GITHUB_ENV"
              fi
            fi
      - name: Set Terraform var enable_keyvault from readiness
        shell: bash
        run: |
          if [ "${KV_READY}" = "true" ]; then
            echo "TF_VAR_enable_keyvault=true" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_enable_keyvault=false" >> "$GITHUB_ENV"
          fi
      - name: Detect Key Vault secrets
        if: ${{ env.TF_VAR_enable_keyvault == 'true' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            KV="${KV_NAME_EXISTING:-${KV_NAME_CALC}}"
            dbid=$(az keyvault secret show --vault-name "$KV" -n "db-password" --query "id" -o tsv 2>/dev/null || true)
            jwtid=$(az keyvault secret show --vault-name "$KV" -n "jwt-secret" --query "id" -o tsv 2>/dev/null || true)
            smtid=$(az keyvault secret show --vault-name "$KV" -n "smtp-password" --query "id" -o tsv 2>/dev/null || true)
            fbsmtid=$(az keyvault secret show --vault-name "$KV" -n "fallback-smtp-password" --query "id" -o tsv 2>/dev/null || true)
            if [ -n "$dbid" ]; then echo "KV_SECRET_DB_ID=$dbid" >> "$GITHUB_ENV"; fi
            if [ -n "$jwtid" ]; then echo "KV_SECRET_JWT_ID=$jwtid" >> "$GITHUB_ENV"; fi
            if [ -n "$smtid" ]; then echo "KV_SECRET_SMTP_ID=$smtid" >> "$GITHUB_ENV"; fi
            if [ -n "$fbsmtid" ]; then echo "KV_SECRET_FB_SMTP_ID=$fbsmtid" >> "$GITHUB_ENV"; fi
      - name: Ensure Key Vault secrets exist
        if: ${{ env.TF_VAR_enable_keyvault == 'true' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            KV="${KV_NAME_EXISTING:-${KV_NAME_CALC}}"
            if az keyvault show -n "$KV" -g "${RESOURCE_GROUP}" &>/dev/null; then
              cur_db=$(az keyvault secret show --vault-name "$KV" -n "db-password" --query "value" -o tsv 2>/dev/null || echo "")
              if [ -n "${TF_VAR_db_password}" ] && [ "${cur_db}" != "${TF_VAR_db_password}" ]; then
                az keyvault secret set --vault-name "$KV" -n "db-password" --value "${TF_VAR_db_password}" >/dev/null
              fi
              cur_jwt=$(az keyvault secret show --vault-name "$KV" -n "jwt-secret" --query "value" -o tsv 2>/dev/null || echo "")
              if [ -n "${TF_VAR_jwt_secret}" ] && [ "${cur_jwt}" != "${TF_VAR_jwt_secret}" ]; then
                az keyvault secret set --vault-name "$KV" -n "jwt-secret" --value "${TF_VAR_jwt_secret}" >/dev/null
              fi
              cur_smtp=$(az keyvault secret show --vault-name "$KV" -n "smtp-password" --query "value" -o tsv 2>/dev/null || echo "")
              if [ -n "${TF_VAR_mail_password}" ] && [ "${cur_smtp}" != "${TF_VAR_mail_password}" ]; then
                az keyvault secret set --vault-name "$KV" -n "smtp-password" --value "${TF_VAR_mail_password}" >/dev/null
              fi
              cur_fb_smtp=$(az keyvault secret show --vault-name "$KV" -n "fallback-smtp-password" --query "value" -o tsv 2>/dev/null || echo "")
              if [ "${TF_VAR_fallback_mail_enabled}" = "true" ] && [ -n "${TF_VAR_fallback_mail_password}" ] && [ "${cur_fb_smtp}" != "${TF_VAR_fallback_mail_password}" ]; then
                az keyvault secret set --vault-name "$KV" -n "fallback-smtp-password" --value "${TF_VAR_fallback_mail_password}" >/dev/null
              fi
            else
              echo "Key Vault $KV not found; skipping secret creation (handled by Terraform if created)"
            fi
      - name: Ensure Web App MSI has access to Key Vault
        if: ${{ env.TF_VAR_enable_keyvault == 'true' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            KV="${KV_NAME_EXISTING:-${KV_NAME_CALC}}"
            APP_MI=$(az webapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "identity.principalId" -o tsv 2>/dev/null || echo "")
            if [ -z "$APP_MI" ]; then
              echo "Web App managed identity not found; ensure SystemAssigned identity is enabled"
              exit 0
            fi
            if [ "${TF_VAR_enable_keyvault_rbac}" = "true" ]; then
              KV_ID=$(az keyvault show -n "$KV" -g "${RESOURCE_GROUP}" --query id -o tsv)
              echo "Assigning RBAC Key Vault Secrets User to Web App MSI on scope $KV_ID"
              az role assignment create --role "Key Vault Secrets User" --assignee "$APP_MI" --scope "$KV_ID" >/dev/null || true
            else
              echo "Setting Access Policy Get/List for Web App MSI"
              az keyvault set-policy -n "$KV" -g "${RESOURCE_GROUP}" --object-id "$APP_MI" --secret-permissions get list >/dev/null || true
            fi
      - name: Terraform import existing Resource Group
        working-directory: ./terraform
        shell: bash
        run: |
          if ! terraform state list | grep -q '^azurerm_resource_group.rg$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}"
            set +e
            terraform import azurerm_resource_group.rg "$ID"
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "Imported Resource Group into state: $ID"
            else
              echo "Resource Group not imported; Terraform will create it if absent"
            fi
          else
            echo "Resource Group already in state"
          fi
      - name: Terraform import existing resources
        working-directory: ./terraform
        shell: bash
        run: |
          set +e
          if [ "${TF_VAR_enable_cdn}" = "true" ]; then
            PROFILE="${TF_VAR_cdn_profile_name:-cdn-devalgas}"
            ENDPOINT="${TF_VAR_cdn_endpoint_name:-cdn-devalgas-endpoint}"
            if ! terraform state list | grep -q '^azurerm_cdn_frontdoor_profile.cdn\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Cdn/profiles/${PROFILE}"
              terraform import "azurerm_cdn_frontdoor_profile.cdn[0]" "$ID" || true
            fi
            if ! terraform state list | grep -q '^azurerm_cdn_frontdoor_endpoint.cdn\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Cdn/profiles/${PROFILE}/afdEndpoints/${ENDPOINT}"
              terraform import "azurerm_cdn_frontdoor_endpoint.cdn[0]" "$ID" || true
            fi
            if ! terraform state list | grep -q '^azurerm_cdn_frontdoor_origin_group.app\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Cdn/profiles/${PROFILE}/originGroups/origin-group-app"
              terraform import "azurerm_cdn_frontdoor_origin_group.app[0]" "$ID" || true
            fi
            if ! terraform state list | grep -q '^azurerm_cdn_frontdoor_origin.app\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Cdn/profiles/${PROFILE}/origins/origin-app"
              terraform import "azurerm_cdn_frontdoor_origin.app[0]" "$ID" || true
            fi
            if ! terraform state list | grep -q '^azurerm_cdn_frontdoor_route.route_all\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Cdn/profiles/${PROFILE}/routes/route-all"
              terraform import "azurerm_cdn_frontdoor_route.route_all[0]" "$ID" || true
            fi
          fi
          # Import CDN budget if it exists already
          if [ "${TF_VAR_enable_cdn}" = "true" ]; then
            if ! terraform state list | grep -q '^azurerm_consumption_budget_subscription.cdn_monthly\\[0\\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.Consumption/budgets/budget-cdn"
              terraform import "azurerm_consumption_budget_subscription.cdn_monthly[0]" "$ID" || true
            fi
          fi
          # Defender pricing plans (import into state if already configured)
          if ! terraform state list | grep -q '^azurerm_security_center_subscription_pricing.app_services\\[0\\]$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.Security/pricings/AppServices"
            terraform import "azurerm_security_center_subscription_pricing.app_services[0]" "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_security_center_subscription_pricing.open_source_db\\[0\\]$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.Security/pricings/OpenSourceRelationalDatabases"
            terraform import "azurerm_security_center_subscription_pricing.open_source_db[0]" "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_security_center_subscription_pricing.key_vaults\\[0\\]$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.Security/pricings/KeyVaults"
            terraform import "azurerm_security_center_subscription_pricing.key_vaults[0]" "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_service_plan.asp$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/serverFarms/${PLAN_NAME}"
            terraform import azurerm_service_plan.asp "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_linux_web_app.app$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${APP_NAME}"
            terraform import azurerm_linux_web_app.app "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_postgresql_flexible_server.db$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${DB_NAME}"
            terraform import azurerm_postgresql_flexible_server.db "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_postgresql_flexible_server_database.app_db$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${DB_NAME}/databases/appdb"
            terraform import azurerm_postgresql_flexible_server_database.app_db "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_postgresql_flexible_server_firewall_rule.allow_azure_services$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${DB_NAME}/firewallRules/allow-azure-services"
            terraform import azurerm_postgresql_flexible_server_firewall_rule.allow_azure_services "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_monitor_action_group.main$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Insights/actionGroups/ag-springboot-alerts"
            terraform import azurerm_monitor_action_group.main "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_monitor_metric_alert.db_high_cpu$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Insights/metricAlerts/alert-db-high-cpu"
            terraform import azurerm_monitor_metric_alert.db_high_cpu "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_monitor_metric_alert.db_low_cpu$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Insights/metricAlerts/alert-db-low-cpu"
            terraform import azurerm_monitor_metric_alert.db_low_cpu "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_monitor_metric_alert.high_memory$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Insights/metricAlerts/alert-high-memory"
            terraform import azurerm_monitor_metric_alert.high_memory "$ID" || true
          fi
          if ! terraform state list | grep -q '^azurerm_monitor_metric_alert.low_memory$'; then
            ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Insights/metricAlerts/alert-low-memory"
            terraform import azurerm_monitor_metric_alert.low_memory "$ID" || true
          fi
          if [ "${TF_VAR_enable_keyvault}" = "true" ]; then
            if ! terraform state list | grep -q '^azurerm_key_vault.kv\[0\]$'; then
              ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.KeyVault/vaults/${KEY_VAULT_NAME}"
              terraform import "azurerm_key_vault.kv[0]" "$ID" || true
            fi
            if ! terraform state list | grep -q '^azurerm_key_vault_secret.db_password\[0\]$'; then
              if [ -n "${KV_SECRET_DB_ID}" ]; then
                terraform import "azurerm_key_vault_secret.db_password[0]" "${KV_SECRET_DB_ID}" || true
              fi
            fi
            if ! terraform state list | grep -q '^azurerm_key_vault_secret.jwt_secret\[0\]$'; then
              if [ -n "${KV_SECRET_JWT_ID}" ]; then
                terraform import "azurerm_key_vault_secret.jwt_secret[0]" "${KV_SECRET_JWT_ID}" || true
              fi
            fi
            if ! terraform state list | grep -q '^azurerm_key_vault_secret.smtp_password\[0\]$'; then
              if [ -n "${KV_SECRET_SMTP_ID}" ]; then
                terraform import "azurerm_key_vault_secret.smtp_password[0]" "${KV_SECRET_SMTP_ID}" || true
              fi
            fi
            if ! terraform state list | grep -q '^azurerm_key_vault_secret.fallback_smtp_password\[0\]$'; then
              if [ -n "${KV_SECRET_FB_SMTP_ID}" ]; then
                terraform import "azurerm_key_vault_secret.fallback_smtp_password[0]" "${KV_SECRET_FB_SMTP_ID}" || true
              fi
            fi
          else
            echo "Key Vault disabled; skipping import"
          fi
          set -e
      - name: Terraform import GitHub Actions variables
        if: ${{ env.TF_VAR_manage_github_vars == 'true' }}
        working-directory: ./terraform
        shell: bash
        run: |
          set +e
          OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1)"
          REPO="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          # Variables
          if ! terraform state list | grep -q '^github_actions_variable.adsense_enabled\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_enabled[0]" "${OWNER}/${REPO}:ADSENSE_ENABLED" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.adsense_client\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_client[0]" "${OWNER}/${REPO}:ADSENSE_CLIENT" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.adsense_slot_top\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_slot_top[0]" "${OWNER}/${REPO}:ADSENSE_SLOT_TOP" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.adsense_slot_sidebar_left\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_slot_sidebar_left[0]" "${OWNER}/${REPO}:ADSENSE_SLOT_SIDEBAR_LEFT" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.adsense_slot_sidebar_right\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_slot_sidebar_right[0]" "${OWNER}/${REPO}:ADSENSE_SLOT_SIDEBAR_RIGHT" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.adsense_slot_footer\\[0\\]$'; then
            terraform import "github_actions_variable.adsense_slot_footer[0]" "${OWNER}/${REPO}:ADSENSE_SLOT_FOOTER" || true
          fi
          if ! terraform state list | grep -q '^github_actions_variable.recaptcha_site_key\\[0\\]$'; then
            terraform import "github_actions_variable.recaptcha_site_key[0]" "${OWNER}/${REPO}:RECAPTCHA_SITE_KEY" || true
          fi
          # Secret (if present)
          if ! terraform state list | grep -q '^github_actions_secret.recaptcha_secret\\[0\\]$'; then
            terraform import "github_actions_secret.recaptcha_secret[0]" "${OWNER}/${REPO}:RECAPTCHA_SECRET" || true
          fi
          set -e
      - name: Terraform validate
        working-directory: ./terraform
        run: terraform validate
      - name: Terraform apply
        if: ${{ env.RUN_TERRAFORM_APPLY == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_apply == 'true') }}
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
      - name: Set outputs
        id: set-outputs
        run: |
          echo "application_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "resource_group=${RESOURCE_GROUP}" >> "$GITHUB_OUTPUT"
          echo "application_url=https://${APP_NAME}.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=${KEY_VAULT_NAME}" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'
      - name: Install frontend dependencies
        shell: bash
        env:
          NODE_ENV: development
        run: |
          rm -rf node_modules
          npm cache clean --force
          npm ci --include=optional
      - name: Ensure Vite available
        shell: bash
        run: |
          if ! npm ls vite --depth=0 >/dev/null 2>&1; then
            npm i -D vite
          fi
      - name: Frontend tests
        shell: bash
        run: |
          set +e
          npm run vitest-run
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "Vitest failed, attempting recovery install with optional deps"
            rm -rf node_modules package-lock.json
            npm cache clean --force
            npm install --include=optional
            npm run vitest-run
          fi
          set -e
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests
        shell: bash
        run: |
          set +e
          npm run backend:unit:test
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "Backend tests failed, attempting dependency refresh"
            ./mvnw -ntp -U -Dskip.installnodenpm -Dskip.npm verify --batch-mode -Dlogging.level.ROOT=OFF -Dlogging.level.tech.jhipster=OFF -Dlogging.level.com.devalgas.blog=OFF -Dlogging.level.org.springframework=OFF -Dlogging.level.org.springframework.web=OFF -Dlogging.level.org.springframework.security=OFF
          fi
          set -e
      - name: Frontend build (prod)
        shell: bash
        env:
          NODE_ENV: development
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT_TOP: ${{ vars.ADSENSE_SLOT_TOP }}
          ADSENSE_SLOT_SIDEBAR_LEFT: ${{ vars.ADSENSE_SLOT_SIDEBAR_LEFT }}
          ADSENSE_SLOT_SIDEBAR_RIGHT: ${{ vars.ADSENSE_SLOT_SIDEBAR_RIGHT }}
          ADSENSE_SLOT_FOOTER: ${{ vars.ADSENSE_SLOT_FOOTER }}
        run: |
          rm -rf target/classes/static
          NODE_ENV=development npm run webapp:build:prod --
      - name: Build Maven prod
        run: ./mvnw -ntp --batch-mode -Pprod -DskipTests package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: target/*.jar
  deploy:
    runs-on: ubuntu-22.04
    needs:
      - manage-infrastructure
      - build
    steps:
      - name: Detect publish profile secret
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$PUBLISH_PROFILE" ]; then
            echo "HAS_PUBLISH_PROFILE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_PUBLISH_PROFILE=false" >> "$GITHUB_ENV"
          fi
      - name: Detect Service Principal secret (deploy)
        id: detect-sp-deploy
        shell: bash
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZ_CREDS" ]; then
            echo "HAS_SP=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SP=false" >> "$GITHUB_ENV"
          fi
      - name: Azure login (OIDC) for deploy
        if: ${{ env.HAS_SP == 'false' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: OIDC
          allow-no-subscriptions: false
        env:
          AZURE_CORE_OUTPUT: none
      - name: Azure login (Service Principal) for deploy
        if: ${{ env.HAS_SP == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL
        env:
          AZURE_CORE_OUTPUT: none
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: target
      - name: Prepare deploy folder
        shell: bash
        run: |
          set -e
          mkdir -p deploy
          cp -v target/*.jar deploy/
      - name: Configure Java startup command
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            JAR=$(ls -1 target/*.jar | head -n 1)
            NAME=$(basename "$JAR")
            echo "Setting startup-file to: java -jar /home/site/wwwroot/$NAME"
            az webapp config set -g "$RG" -n "$APP" --startup-file "java -jar /home/site/wwwroot/$NAME"
      - name: Increase startup timeout and enable logs
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            az webapp config appsettings set -g "$RG" -n "$APP" --settings WEBSITES_CONTAINER_START_TIME_LIMIT=300
            az webapp log config -g "$RG" -n "$APP" --application-logging filesystem --level information
      - name: Configure App Settings (no publish profile)
        if: ${{ env.HAS_PUBLISH_PROFILE == 'false' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            DB_NAME=$(az postgres flexible-server list -g "$RG" --query "[0].name" -o tsv || echo "")
            if [ -n "$DB_NAME" ]; then
              FQDN=$(az postgres flexible-server show -g "$RG" -n "$DB_NAME" --query "fullyQualifiedDomainName" -o tsv)
              ADMIN=$(az postgres flexible-server show -g "$RG" -n "$DB_NAME" --query "administratorLogin" -o tsv)
              DBURL="jdbc:postgresql://${FQDN}:5432/appdb?sslmode=require"
              echo "Configuring app settings for DB URL: $DBURL"
              az webapp config appsettings set -g "$RG" -n "$APP" --settings \
                SPRING_PROFILES_ACTIVE=prod \
                SPRING_DATASOURCE_URL="$DBURL" \
                SPRING_DATASOURCE_USERNAME="$ADMIN" \
                SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET="${{ secrets.JWT_SECRET }}"
            else
              echo "No PostgreSQL server found in resource group $RG; skipping DB app settings"
            fi
      - name: Configure Application Settings (idempotent full sync)
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            DB_NAME=$(az postgres flexible-server list -g "$RG" --query "[0].name" -o tsv || echo "")
            DBURL=""
            ADMIN=""
            if [ -n "$DB_NAME" ]; then
              FQDN=$(az postgres flexible-server show -g "$RG" -n "$DB_NAME" --query "fullyQualifiedDomainName" -o tsv)
              ADMIN=$(az postgres flexible-server show -g "$RG" -n "$DB_NAME" --query "administratorLogin" -o tsv)
              DBURL="jdbc:postgresql://${FQDN}:5432/appdb?sslmode=require"
            fi
            KV="$(az keyvault list -g "$RG" --query "[0].name" -o tsv || echo "")"
            KV_SMTP_ID=""
            KV_FB_SMTP_ID=""
            KV_DB_ID=""
            KV_JWT_ID=""
            if [ -n "$KV" ]; then
              KV_SMTP_ID=$(az keyvault secret show --vault-name "$KV" -n "smtp-password" --query "id" -o tsv 2>/dev/null || true)
              KV_FB_SMTP_ID=$(az keyvault secret show --vault-name "$KV" -n "fallback-smtp-password" --query "id" -o tsv 2>/dev/null || true)
              KV_DB_ID=$(az keyvault secret show --vault-name "$KV" -n "db-password" --query "id" -o tsv 2>/dev/null || true)
              KV_JWT_ID=$(az keyvault secret show --vault-name "$KV" -n "jwt-secret" --query "id" -o tsv 2>/dev/null || true)
            fi
            normalize_bool() {
              v="$(echo "$1" | tr '[:upper:]' '[:lower:]')"
              case "$v" in
                1|true|yes|on) echo "true" ;;
                *) echo "false" ;;
              esac
            }
            FB_ENABLED="$(normalize_bool "${FALLBACK_MAIL_ENABLED}")"
            get_current() {
              az webapp config appsettings list -g "$RG" -n "$APP" --query "[?name=='$1'].value | [0]" -o tsv 2>/dev/null || echo ""
            }
            set_setting() {
              k="$1"; v="$2"
              if [ -z "$v" ]; then return 0; fi
              cur="$(get_current "$k")"
              if [ "$cur" != "$v" ]; then
                az webapp config appsettings set -g "$RG" -n "$APP" --settings "$k=$v" >/dev/null
              fi
            }
            set_setting "SPRING_PROFILES_ACTIVE" "prod"
            if [ -n "$DBURL" ]; then
              set_setting "SPRING_DATASOURCE_URL" "$DBURL"
              set_setting "SPRING_DATASOURCE_USERNAME" "$ADMIN"
              DB_PWD=""
              if [ -n "$KV_DB_ID" ]; then DB_PWD="@Microsoft.KeyVault(SecretUri=$KV_DB_ID)"; fi
              if [ -z "$DB_PWD" ] && [ -n "${DB_PASSWORD}" ]; then DB_PWD="${DB_PASSWORD}"; fi
              set_setting "SPRING_DATASOURCE_PASSWORD" "$DB_PWD"
            fi
            JWT_VAL=""
            if [ -n "$KV_JWT_ID" ]; then JWT_VAL="@Microsoft.KeyVault(SecretUri=$KV_JWT_ID)"; fi
            if [ -z "$JWT_VAL" ] && [ -n "${JWT_SECRET}" ]; then JWT_VAL="${JWT_SECRET}"; fi
            set_setting "JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET" "$JWT_VAL"
            MAIL_PWD=""
            if [ -n "$KV_SMTP_ID" ]; then MAIL_PWD="@Microsoft.KeyVault(SecretUri=$KV_SMTP_ID)"; fi
            if [ -z "$MAIL_PWD" ] && [ -n "${MAIL_PASSWORD}" ]; then MAIL_PWD="${MAIL_PASSWORD}"; fi
            set_setting "SPRING_MAIL_PASSWORD" "$MAIL_PWD"
            set_setting "SPRING_MAIL_HOST" "${MAIL_HOST}"
            set_setting "SPRING_MAIL_PORT" "${MAIL_PORT}"
            set_setting "SPRING_MAIL_USERNAME" "${MAIL_USERNAME}"
            set_setting "SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH" "true"
            set_setting "SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE" "true"
            set_setting "JHIPSTER_MAIL_FROM" "${MAIL_FROM}"
            set_setting "MAIL_FROM_CONTACT" "${MAIL_FROM_CONTACT}"
            BASE_URL="${MAIL_BASE_URL}"
            if [ -z "$BASE_URL" ]; then
              BASE_URL="${APPLICATION_URL}"
            fi
            set_setting "JHIPSTER_MAIL_BASE_URL" "$BASE_URL"
            if [ "$FB_ENABLED" = "true" ] || [ -n "$KV_FB_SMTP_ID" ] || [ -n "${FALLBACK_MAIL_PASSWORD}" ]; then
              FB_PWD=""
              if [ -n "$KV_FB_SMTP_ID" ]; then FB_PWD="@Microsoft.KeyVault(SecretUri=$KV_FB_SMTP_ID)"; fi
              if [ -z "$FB_PWD" ] && [ -n "${FALLBACK_MAIL_PASSWORD}" ]; then FB_PWD="${FALLBACK_MAIL_PASSWORD}"; fi
              set_setting "FALLBACK_MAIL_ENABLED" "true"
              set_setting "FALLBACK_MAIL_HOST" "${FALLBACK_MAIL_HOST}"
              set_setting "FALLBACK_MAIL_PORT" "${FALLBACK_MAIL_PORT}"
              set_setting "FALLBACK_MAIL_USERNAME" "${FALLBACK_MAIL_USERNAME}"
              set_setting "FALLBACK_MAIL_PASSWORD" "$FB_PWD"
            fi
            set_setting "RECAPTCHA_SITE_KEY" "${RECAPTCHA_SITE_KEY}"
            set_setting "RECAPTCHA_SECRET" "${RECAPTCHA_SECRET}"
            set_setting "LINKEDIN_URL" "${LINKEDIN_URL}"
            set_setting "TWITTER_URL" "${TWITTER_URL}"
            set_setting "GITHUB_URL" "${GITHUB_URL}"
            set_setting "MEDIUM_URL" "${MEDIUM_URL}"
            set_setting "WHATSAPP_URL" "${WHATSAPP_URL}"
            set_setting "CONTACT_EMAIL" "${CONTACT_EMAIL}"
            set_setting "CONTACT_PHONE" "${CONTACT_PHONE}"
        env:
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_BASE_URL: ${{ vars.MAIL_BASE_URL }}
          MAIL_FROM_CONTACT: ${{ vars.MAIL_FROM_CONTACT }}
          FALLBACK_MAIL_ENABLED: ${{ vars.FALLBACK_MAIL_ENABLED }}
          FALLBACK_MAIL_HOST: ${{ vars.FALLBACK_MAIL_HOST }}
          FALLBACK_MAIL_PORT: ${{ vars.FALLBACK_MAIL_PORT }}
          FALLBACK_MAIL_USERNAME: ${{ vars.FALLBACK_MAIL_USERNAME }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FALLBACK_MAIL_PASSWORD: ${{ secrets.FALLBACK_MAIL_PASSWORD }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
          TWITTER_URL: ${{ vars.TWITTER_URL }}
          GITHUB_URL: ${{ vars.GITHUB_URL }}
          MEDIUM_URL: ${{ vars.MEDIUM_URL }}
          WHATSAPP_URL: ${{ vars.WHATSAPP_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CONTACT_PHONE: ${{ vars.CONTACT_PHONE }}
          APPLICATION_URL: ${{ needs.manage-infrastructure.outputs.application_url }}
      - name: Deploy to Azure App Service (publish profile)
        if: ${{ env.HAS_PUBLISH_PROFILE == 'true' }}
        id: deploy_pp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.manage-infrastructure.outputs.application_name }}
          resource-group: ${{ needs.manage-infrastructure.outputs.resource_group }}
          package: deploy
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      - name: Deploy to Azure App Service (Azure login)
        if: ${{ env.HAS_PUBLISH_PROFILE == 'false' }}
        id: deploy_login
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.manage-infrastructure.outputs.application_name }}
          resource-group: ${{ needs.manage-infrastructure.outputs.resource_group }}
          package: deploy
      - name: Fallback deploy via Azure CLI (config-zip)
        if: ${{ steps.deploy_pp.outcome == 'failure' || steps.deploy_login.outcome == 'failure' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            zip -r deploy.zip deploy/
            az webapp deployment source config-zip -g "$RG" -n "$APP" --src "deploy.zip"
      - name: Restart Web App
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            az webapp restart -g "$RG" -n "$APP"
      - name: Purge CDN (HTML & manifest)
        if: ${{ vars.ENABLE_CDN == 'true' }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            PROFILE="${CDN_PROFILE_NAME:-cdn-devalgas}"
            ENDPOINT="${CDN_ENDPOINT_NAME:-cdn-devalgas-endpoint}"
            az afd endpoint purge -g "$RG" --profile-name "$PROFILE" --endpoint-name "$ENDPOINT" --content-paths "/index.html" "/manifest.json" "/service-worker.js"
        env:
          CDN_PROFILE_NAME: ${{ vars.CDN_PROFILE_NAME }}
          CDN_ENDPOINT_NAME: ${{ vars.CDN_ENDPOINT_NAME }}
      - name: Health check application
        shell: bash
        run: |
          set -e
          base="${{ needs.manage-infrastructure.outputs.application_url }}"
          health="$base/management/health"
          echo "Health check on: $health"
          attempts=20
          sleep_seconds=15
          ok=false
          for i in $(seq 1 $attempts); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$health" || echo "000")
            echo "Attempt $i/$attempts => HTTP $code"
            if [ "$code" -eq 200 ]; then
              status=$(curl -s "$health" | jq -r '.status' 2>/dev/null || echo "")
              echo "Actuator status: $status"
              if [ "$status" = "UP" ] || [ "$status" = "UNKNOWN" ]; then
                ok=true
                break
              fi
            fi
            # fallback root check
            root_code=$(curl -s -o /dev/null -w "%{http_code}" "$base" || echo "000")
            echo "Root check HTTP: $root_code"
            if [ "$root_code" -eq 200 ]; then
              ok=true
              break
            fi
            sleep "$sleep_seconds"
          done
          if [ "$ok" != "true" ]; then
            echo "Health check failed after $attempts attempts"
            exit 1
          fi
      - name: Download logs on failure
        if: ${{ failure() }}
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            APP="${{ needs.manage-infrastructure.outputs.application_name }}"
            az webapp log download -g "$RG" -n "$APP" --log-file logs.zip || true
      - name: Upload logs artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: webapp-logs
          path: logs.zip
  display-information:
    runs-on: ubuntu-22.04
    needs:
      - manage-infrastructure
    steps:
      - name: Detect Service Principal secret (display)
        id: detect-sp-display
        shell: bash
        env:
          AZ_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZ_CREDS" ]; then
            echo "HAS_SP=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SP=false" >> "$GITHUB_ENV"
          fi
      - name: Azure login (OIDC)
        if: ${{ env.HAS_SP == 'false' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: OIDC
          allow-no-subscriptions: false
        env:
          AZURE_CORE_OUTPUT: none
      - name: Azure login (Service Principal)
        if: ${{ env.HAS_SP == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          auth-type: SERVICE_PRINCIPAL
        env:
          AZURE_CORE_OUTPUT: none
      - name: Display Azure infrastructure information
        run: |
          echo "application_name=${{ needs.manage-infrastructure.outputs.application_name }}"
          echo "application_url=${{ needs.manage-infrastructure.outputs.application_url }}"
          echo "resource_group=${{ needs.manage-infrastructure.outputs.resource_group }}"
      - name: Show Key Vault details
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            RG="${{ needs.manage-infrastructure.outputs.resource_group }}"
            KV_CALC="${{ needs.manage-infrastructure.outputs.key_vault_name }}"
            echo "Expected Key Vault name: ${KV_CALC}"
            echo "Listing Key Vaults in resource group: ${RG}"
            az keyvault list -g "${RG}" -o table || true
            name=$(az keyvault list -g "${RG}" --query "[0].name" -o tsv)
            if [ -n "$name" ]; then
              echo "Detected Key Vault: $name"
              az keyvault show -n "$name" -g "${RG}" -o json | jq '{name: .name, location: .location, tenantId: .properties.tenantId, uri: .properties.vaultUri}'
            else
              echo "No Key Vault found in resource group ${RG}"
            fi

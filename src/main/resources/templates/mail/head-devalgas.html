<div xmlns:th="http://www.thymeleaf.org" th:fragment="logoHeader" class="container-title py-0">
  <style>
    .container-title {
      display: flex;
      justify-content: center;
    }
    .container-title__box {
      width: 250px;
      position: relative;
      display: flex;
      justify-content: center;
      flex-direction: column;
    }
    .container-title__title {
      width: 75%;
      position: relative;
      display: flex;
      align-items: center;
      height: 50px;
      margin-left: 15px;
    }
    .container-title__title-block {
      width: 100%;
      height: 50px;
      background: #b58900;
      position: absolute;
    }
    .container-title__heading {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      font-size: 29px;
      display: flex;
      align-items: baseline;
      position: relative;
      margin: 0;
    }
    .container-title__heading span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b58900;
      margin-left: 5px;
      position: absolute;
      bottom: 5px;
      right: -12px;
      box-shadow: 0 0 3px 3px #002b36;
    }
    .container-title__role {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      height: 20px;
    }
    .container-title__role-block {
      width: 100%;
      height: 20px;
      background: #b58900;
      position: absolute;
    }
    .container-title__role p {
      font-family: 'Lato', sans-serif;
      font-size: 20px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-weight: 800;
      opacity: 0.5;
    }
  </style>
  <div class="box container-title__box">
    <div class="title container-title__title">
      <span class="block container-title__title-block"></span>
      <h1 class="container-title__heading">[ Devalgas ]<span></span></h1>
    </div>
    <div class="role container-title__role">
      <div class="block container-title__role-block"></div>
      <p th:text="#{email.subscribe.position}">Software Engineer</p>
    </div>
  </div>
</div>
